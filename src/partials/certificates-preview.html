<section class="certs-preview" id="certificates">
  <div class="container">

    <div class="certs-preview__head">
      <span class="certs-preview__label">Досягнення</span>
      <h2 class="certs-preview__title">Сертифікати та підвищення кваліфікації</h2>
      <span class="certs-preview__divider"></span>
      <p class="certs-preview__desc">
        Понад 25 років навчання не зупиняється — курси, конференції та тренінги в Україні та за кордоном, що підтверджують кваліфікацію.
      </p>
    </div>

    <div class="certs-preview__grid">
      <button type="button" class="cert-tile" data-cert-trigger data-full="img/certificates/full/cert-01.jpg" data-index="0" aria-label="Відкрити сертифікат у повному розмірі">
        <img src="img/certificates/thumb/cert-01.jpg" alt="Сертифікат Ольги Єременко — Bayer HealthCare" loading="lazy">
        <span class="cert-tile__zoom" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
      <button type="button" class="cert-tile" data-cert-trigger data-full="img/certificates/full/cert-33.jpg" data-index="1" aria-label="Відкрити сертифікат у повному розмірі">
        <img src="img/certificates/thumb/cert-33.jpg" alt="Сертифікат Ольги Єременко — міжнародний конгрес" loading="lazy">
        <span class="cert-tile__zoom" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
      <button type="button" class="cert-tile" data-cert-trigger data-full="img/certificates/full/cert-37.jpg" data-index="2" aria-label="Відкрити сертифікат у повному розмірі">
        <img src="img/certificates/thumb/cert-37.jpg" alt="Сертифікат Ольги Єременко — конференція" loading="lazy">
        <span class="cert-tile__zoom" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
      <button type="button" class="cert-tile" data-cert-trigger data-full="img/certificates/full/cert-39.jpg" data-index="3" aria-label="Відкрити сертифікат у повному розмірі">
        <img src="img/certificates/thumb/cert-39.jpg" alt="Сертифікат Ольги Єременко — Ian Donald University School" loading="lazy">
        <span class="cert-tile__zoom" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
      <button type="button" class="cert-tile" data-cert-trigger data-full="img/certificates/full/cert-40.jpg" data-index="4" aria-label="Відкрити сертифікат у повному розмірі">
        <img src="img/certificates/thumb/cert-40.jpg" alt="Сертифікат Ольги Єременко — професійний розвиток лікаря" loading="lazy">
        <span class="cert-tile__zoom" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
      <button type="button" class="cert-tile" data-cert-trigger data-full="img/certificates/full/cert-41.jpg" data-index="5" aria-label="Відкрити сертифікат у повному розмірі">
        <img src="img/certificates/thumb/cert-41.jpg" alt="Сертифікат Ольги Єременко — Гармонія гормонів" loading="lazy">
        <span class="cert-tile__zoom" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </button>
    </div>

    <div class="certs-preview__footer">
      <a href="certificates.html" class="certs-preview__btn">
        Переглянути всі сертифікати
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

  </div>

  <!-- Certificate lightbox -->
  <div class="cert-modal" id="cert-modal" aria-hidden="true">
    <div class="cert-modal__backdrop" data-cert-close></div>
    <div class="cert-modal__inner">
      <button type="button" class="cert-modal__close" data-cert-close aria-label="Закрити">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="cert-modal__nav cert-modal__nav--prev" data-cert-prev aria-label="Попередній сертифікат">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="cert-modal__figure">
        <img src="" alt="Сертифікат у повному розмірі" class="cert-modal__img" id="cert-modal-img">
        <span class="cert-modal__counter" id="cert-modal-counter"></span>
      </div>
      <button type="button" class="cert-modal__nav cert-modal__nav--next" data-cert-next aria-label="Наступний сертифікат">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

</section>
