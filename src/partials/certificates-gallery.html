<section class="certs-hero">

    <span class="certs-hero__tag">Про лікаря</span>
    <h1 class="certs-hero__title">Сертифікати та дипломи</h1>

    <p class="certs-hero__desc">

  </div>
</section>

<!-- Certificate lightbox -->
<div class="cert-modal" id="cert-modal" aria-hidden="true">
  <div class="cert-modal__backdrop" data-cert-close></div>
  <div class="cert-modal__inner">
    <button type="button" class="cert-modal__close" data-cert-close aria-label="Закрити">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" class="cert-modal__nav cert-modal__nav--prev" data-cert-prev aria-label="Попередній сертифікат">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="cert-modal__figure">
      <img src="" alt="Сертифікат у повному розмірі" class="cert-modal__img" id="cert-modal-img">
      <span class="cert-modal__counter" id="cert-modal-counter"></span>
    </div>
    <button type="button" class="cert-modal__nav cert-modal__nav--next" data-cert-next aria-label="Наступний сертифікат">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>
